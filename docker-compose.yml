services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: dm-hero:dev
    container_name: dm-hero-dev
    ports:
      - '3000:3000'
    volumes:
      # Mount the entire project directory to the container for local development
      - .:/app
      # In case you want to test you changes on the same data as you production container,
      #   map the `data` and `uploads` directories in the same manner as the production container does.
      - ./data:/app/packages/app/data
      - ./uploads:/app/packages/app/uploads
    environment:
      # Nuxt runtime config
      NODE_ENV: development
      NITRO_PORT: 3000
      NITRO_HOST: 0.0.0.0
    command: pnpm run dev

  dm-hero:
    build:
      context: .
      dockerfile: Dockerfile
    image: dm-hero:latest
    container_name: dm-hero
    ports:
      - '4444:3000'
    volumes:
      # Persist SQLite database
      - ./data:/app/data
      # Persist uploaded files (images, audio, etc.) — the server writes to
      # process.cwd()/uploads, which is /app/uploads inside the container.
      - ./uploads:/app/uploads
    environment:
      # Nuxt runtime config
      NODE_ENV: production
      NITRO_PORT: 3000
      NITRO_HOST: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
